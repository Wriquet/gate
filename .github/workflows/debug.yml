name: debug-worker
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: verify custom domains
        run: |
          for u in "https://proxy.1111009.xyz/" "https://temp-mail-api.finalrouter.xyz/"; do
            echo "=== $u ==="
            curl -sS -o /tmp/b --max-time 25 -w 'code=%{http_code} size=%{size_download}\n' "$u" || echo "curl rc=$?"
            head -c 200 /tmp/b; echo
          done

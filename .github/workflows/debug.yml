name: debug-worker
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: curl endpoints
        run: |
          for u in "https://probe-ok-b.zerosoul929.workers.dev/" "https://probe-ok-2026.zerosoul929.workers.dev/" "https://gate-hello.zerosoul929.workers.dev/"; do
            echo "=== $u ==="
            for i in 1 2; do
              curl -sS -o /tmp/body -w 'code=%{http_code} ' --max-time 20 "$u" || echo "curl failed"
              echo "BODY: $(cat /tmp/body 2>/dev/null)"
            done
          done

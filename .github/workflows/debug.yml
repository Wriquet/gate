name: debug-worker
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: verify gate-check
        run: |
          for u in "https://gate-check.zerosoul929.workers.dev/" "https://gate-check.zerosoul929.workers.dev/ip.json" "https://gate-check.zerosoul929.workers.dev/check?sstp=vpn:vpn@public-vpn-232.opengw.net%3A995"; do
            echo "=== $u ==="
            curl -sS -o /tmp/b --max-time 30 -w 'code=%{http_code} size=%{size_download}\n' "$u" || echo "curl rc=$?"
            head -c 400 /tmp/b; echo
          done

name: debug-worker
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probes
        run: |
          for h in gate-hello zerosoul929-doesnotexist-abc123 cfnew-proxy; do
            u="https://$h.zerosoul929.workers.dev/"
            echo "=== $u ==="
            curl -sS -o /tmp/body -w 'code=%{http_code} ip=%{remote_ip}\n' --max-time 20 "$u" || echo "curl failed rc=$?"
            echo "BODY: $(cat /tmp/body 2>/dev/null)"
          done
          echo "=== dns ==="
          getent hosts gate-hello.zerosoul929.workers.dev || true
          getent hosts zerosoul929-doesnotexist-abc123.zerosoul929.workers.dev || echo "NXDOMAIN for bogus"

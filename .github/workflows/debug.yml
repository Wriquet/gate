name: debug-worker
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: verify check.1111009.xyz
        run: |
          echo "=== /ip.json ==="
          curl -sS -o /tmp/ip --max-time 25 -w 'code=%{http_code} size=%{size_download}\n' "https://check.1111009.xyz/ip.json" || echo "rc=$?"
          head -c 500 /tmp/ip; echo
          echo "=== /check (SSTP node) ==="
          curl -sS -o /tmp/ck --max-time 90 -w 'code=%{http_code} size=%{size_download} time=%{time_total}s\n' "https://check.1111009.xyz/check?sstp=vpn:vpn@public-vpn-232.opengw.net%3A995" || echo "rc=$?"
          head -c 600 /tmp/ck; echo

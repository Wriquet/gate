name: debug-worker
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: curl endpoints
        run: |
          for u in "https://probe-ok-2026.zerosoul929.workers.dev/" "https://gate-hello.zerosoul929.workers.dev/" "https://cfnew-proxy.zerosoul929.workers.dev/"; do
            echo "=== $u ==="
            curl -sS -o /tmp/body -D /tmp/hdr --max-time 20 -w 'code=%{http_code} size=%{size_download} ip=%{remote_ip}\n' "$u"
            head -3 /tmp/hdr
            echo "BODY: $(cat /tmp/body)"
          done
